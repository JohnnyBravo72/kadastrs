# XLSX sheets: the first row's column titles (empty trailing titles ignored).
xlsx:
  fid_subjects:
    sheet: Dati
    columns:
      - "1. Sankciju subjekts, kā līdzekļi vai saimnieciskie resursi ir iesaldēti (vārds, uzvārds / nosaukums)"
      - "2. Dzimšanas datums / reģistrācijas Nr."
      - "3. Valstspiederība / reģistrācijas valsts"
      - "4. Iesaldēto līdzekļu vai saimniecisko resursu veids"
      - "5. Līdzekļu vai saimniecisko resursu iesaldēšanas pamatojums"
      - "6. Sankciju sarakstā iekļautās personas vārds, uzvārds vai nosaukums"
      - "7. Datums, no kura spēkā ir sankcijas, pret 6. kolonnā norādīto personu"
      - "8. Normatīvais akts, saskaņā ar ko veikta iesaldēšana"
      - "9. FID pārbaudīts*"
      - "10. Datums, kad FID pirmo reizi publicējis informāciju par sankciju subjektu"
  # FID TA, VZD: two header rows; row 2 holds the numbered titles (verified 2026-10-13).
  fid_ta_vzd:
    sheet: Dati
    header_row: 2
    columns:
      - "1. Sankciju subjekts, kā saimnieciskie resursi ir iesaldēti (vārds, uzvārds / nosaukums)"
      - "2. Dzimšanas datums / reģistrācijas Nr."
      - "3. Valstspiederība / reģistrācijas valsts"
      - "4.  Iesaldēto saimniecisko resursu veids"
      - "5. Iesaldēto saimniecisko resursu saistība ar sankciju subjektu"
      - "6. Kadastra numurs"
      - "7. Adrese"
      - "8. Fiskālā kadastrālā vērtība (EUR)"
      - "9. Universālā kadastrālā vērtība (EUR)"
      - "10. Atzīme reģistrā - tiesas piemērotie liegumi"
      - "11.Atzīme reģistrā par nosūtīts izvērtēšanai tiesai"
      - "12. Saimniecisko resursu iesaldēšanas pamats"
      - "13. Sankciju sarakstā iekļautās personas vārds, uzvārds vai nosaukums"
      - "14. Sankciju sarakstā iekļautās personas dzimšanas dati, reģistrācijas numurs"
      - "15. Datums, no kura spēkā ir sankcijas, pret 13. kolonnā norādīto personu"
      - "16. Normatīvais akts, saskaņā ar ko veikta iesaldēšana"
      - "17. FID pārbaudīts"
      - "18. Datums, kad FID publicējis informāciju par attiecīgo saimniecisko resursu"

