# ETL settings (Phase 2a). Resource ids must also be listed for the same source
# in config/sources.yaml (a test checks it). URLs are never stored here: they
# come from CKAN package_show on every run (rule E1).

ckan_api: "https://data.gov.lv/dati/api/3/action/"

# Pilot area (PLAN.md §9): Daugavpils, Jelgava, Jūrmala. ATVK codes are text.
pilot_atvk: ["0002000", "0003000", "0004000"]
# Cadastral territory code of each pilot city: the first 4 digits of its parcel and
# building designations (checked on the cadastre text, docs/data-sources.md §7.1).
# Sources without an ATVK per row (BIS objects, frozen encumbrances) are cut to the
# pilot by designation prefix.
pilot_cadastral_territory: {"0002000": "0500", "0003000": "0900", "0004000": "1300"}

