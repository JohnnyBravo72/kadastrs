      - "https://geo-dpps.viss.gov.lv/api/DPPSPackage/client/Teritorija_451_GKJOzb/96f059e4-9ed2-479c-976f-dcbed668972f"
    host: geo-dpps.viss.gov.lv
    datagov_dataset: teritorijas-attstbas-plnoanas-informcijas-sistmas-tapis-eotelpiskie-dati
    status: allowed
  - id: E5
    name: "Plūdu WMTS/WMS (map images only)"
    url:
      - "https://geo-dpps.viss.gov.lv/api/DPPSPackage/client/Pludu_risk_443_Dv50WI/5acd43d2-15bf-4fb6-b163-6628576c15cb"
      - "https://geo-dpps.viss.gov.lv/api/DPPSPackage/client/3._cikla_L_556_karVbb/cc6f2ed3-dbfb-42d0-98e1-4d9f10f57fea"
      - "https://geo-dpps.viss.gov.lv/api/DPPSPackage/client/3._cikla_L_557_7iFPTq/b7ad025f-833a-4b4f-a845-d5cec9d24092"
      - "https://geo-dpps.viss.gov.lv/api/DPPSPackage/client/3._cikla_L_558_jIS73E/3322e012-8cb3-4a4c-8acf-a467e25a17b3"
    host: geo-dpps.viss.gov.lv
    datagov_dataset: [pldu-riska-karu-atvrtie-dati-un-servisi1, 3-cikla-latvijas-pldu-postjumu-vietu-un-pldu-riska-kartes1]
    status: allowed
  - id: E6
    name: "ĢEOLatvija plūdu produkti 309, 361 (SHP)"
    url:
      - "https://geolatvija.lv/main?geoProductId=309"
      - "https://geolatvija.lv/main?geoProductId=361"
    host: geolatvija.lv
    datagov_dataset: [pldu-riska-karu-atvrtie-dati-un-servisi, 3-cikla-latvijas-pldu-postjumu-vietu-un-pldu-riska-kartes]
    status: withdrawn       # decided 2026-10-10 (docs/decisions.md, E6)
    note: "Withdrawn 2026-10-10: geolatvija product files require login (HTTP 401), not open data under rule 1. Re-add (status: allowed) if the files become open."
  - id: E7
    name: "LVĢMC ArcGIS Pavasara_pludu_kartes_3_cikls (layers 0, 1 = 10-year; layer 3 = coverage mask)"
    url: "https://geodata.lvgmc.lv/server/rest/services/Atvertie_dati/Pavasara_pludu_kartes_3_cikls/MapServer"
    host: geodata.lvgmc.lv
    layers: [0, 1, 3]       # 0 Pavasara_palu_010_3_cikls, 1 Pavasara_pali_Salaca_010_3_cikls (findings)
    # 3 Pavasara_palu_200_3_cikls: coverage mask only, never a finding (decided 2026-10-09, D1 E7)
    layer_roles: {0: finding, 1: finding, 3: coverage_mask}
    datagov_dataset: null   # same data described by 3-cikla-latvijas-pldu-postjumu-vietu-un-pldu-riska-kartes1
    status: allowed         # decided 2026-10-09 (docs/decisions.md, E7); layer 3 added 2026-10-09
    licence: CC0-1.0        # per data.gov.lv listing of the same data: 3-cikla-latvijas-pldu-postjumu-vietu-un-pldu-riska-kartes1
    access: snapshot        # imported as a versioned snapshot; never queried live
    # no fallback: E6 withdrawn 2026-10-10
    # Source processing notes: listed on the report's "Avoti" sheet (PLAN §7.1).
    processing:
      - id: coverage_mask
        what: "Layer 3 (200-year extent) is used only as the coverage mask; outside it module 4 reports not_covered"
        why: "No designated flood risk areas (APSFR) or modelled-area polygons are published as open data"
        effect: "Outside the mask: not_covered, never clear"
        report_lv: "Ārpus plūdu kartēs attēlotās teritorijas – plūdu karte šeit nav pieejama vai teritorija nav applūstoša pat 200 gadu scenārijā."
      - id: simplify_1cm
        what: "Geometry fetched with ArcGIS maxAllowableOffset=0.01 (1 cm generalisation)"
        why: "The server returns HTTP 500 for very large polygons without it (e.g. objectid 24562, 216 km2)"
        effect: "Area change < 0.001% on the largest polygon (215.96 -> 215.958 km2)"
        report_lv: "Ģeometrija iegūta ar 1 cm vienkāršošanu (servera ierobežojums); laukuma izmaiņa < 0,001 %."
      - id: make_valid
        what: "Invalid geometries repaired with PostGIS ST_MakeValid(method=structure) (ring self-intersections)"
        why: "About 5% of polygons are invalid at the source (Jelgava sample: 37 of 749)"
        effect: "Total area unchanged in the Jelgava sample (216.904 km2 before and after)"
        report_lv: "Nederīgas ģeometrijas (pašpārklāšanās) labotas automātiski; kopējais laukums nemainās."
      - id: reproject
        what: "Transformed EPSG:3059 -> EPSG:10306 with EPSG:10838 (NTv2 grid lv_lgia_lks92to2020.tif)"
        why: "Storage CRS is LKS-2020 (D9)"
        effect: "~1 cm accuracy"
        report_lv: "Pārveidots no LKS-92 uz LKS-2020 (EPSG:10838, ~1 cm precizitāte)."
