# Source registry (PLAN.md §4, table `source`).
# Add an entry only after the dataset is verified in docs/data-sources.md.
# Freshness (docs/decisions.md "Freshness"): a source is fresh when we hold the
# newest file it has published (package_show last_modified at run time); it is
# flagged when a newer file exists, or when the publisher itself has released
# nothing for longer than `source_stale_after`.
