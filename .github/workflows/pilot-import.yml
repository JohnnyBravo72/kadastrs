name: Pilot import

# Real import of the pilot cities (data.gov.lv ~900 MB + LVĢMC flood service),
# twice, then the full test suite including the `pilot` tests (row counts
# against the source files, geometry, seed objects, second run unchanged).
on:
  workflow_dispatch:
  schedule:
    # Mondays 03:00 UTC: before VARIS republishes (~05:20 UTC), so the two runs see the same files
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: pilot-import
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04   # pinned; upgrade deliberately (docs/runbook.md)
    timeout-minutes: 180   # nine sources, imported twice; flood repair takes minutes
    steps:
      - uses: actions/checkout@v5
      - name: Build and start db, migrate, api
        run: docker compose up -d --build --wait
      - name: Import all (first run)
        run: docker compose run --rm etl import all
      - name: Import all (second run, must create no new versions)
        run: docker compose run --rm etl import all
      - name: Status
        run: docker compose run --rm etl status
      - name: Run all tests including pilot
        run: docker compose --profile test run --rm tests
      - name: Service logs
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Stop
        if: always()
        run: docker compose --profile test --profile etl down -v
