# Dev stack (local only, D3 interim). Started from the repo root via compose.yaml:
#   docker compose up -d --build
# Credentials are dev-only defaults; ports are bound to 127.0.0.1.
# Override with environment variables KADASTRS_DB_PASSWORD, KADASTRS_DB_PORT, KADASTRS_API_PORT.

x-db-url: &db-url postgresql://kadastrs:${KADASTRS_DB_PASSWORD:-kadastrs-dev}@db:5432/kadastrs

services:
  db:
    build: ./db
    image: kadastrs-db:dev
    environment:
      POSTGRES_DB: kadastrs
      POSTGRES_USER: kadastrs
      POSTGRES_PASSWORD: ${KADASTRS_DB_PASSWORD:-kadastrs-dev}
    ports:
      - "127.0.0.1:${KADASTRS_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - dbdata:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during initdb the server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kadastrs", "-d", "kadastrs"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Applies infra/migrations (plain SQL, dbmate), then exits.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://kadastrs:${KADASTRS_DB_PASSWORD:-kadastrs-dev}@db:5432/kadastrs?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./migrations:/migrations:ro
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: runtime
    image: kadastrs-api:dev
    environment:
      DATABASE_URL: *db-url
      # Phase 10: when set, API requires Authorization: Bearer <token> (except /health).
      KADASTRS_AUTH_TOKEN: ${KADASTRS_AUTH_TOKEN:-}
    volumes:
      # Live config: edits to config/*.yaml apply without rebuilding the image.
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:${KADASTRS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s

  # --- tiles profile: Martin vector tiles for whole-country reference (Phase 9) ---
  #   docker compose --profile tiles up -d martin
  # Serves live cadastre parcel/building MVT at http://127.0.0.1:3000/
  # (views ref.kk_parcel_live / ref.kk_building_live). Optional underlay; the
  # results map stays on Leaflet + run-scoped GeoJSON (D12).

  martin:
    profiles: [tiles]
    image: ghcr.io/maplibre/martin:v0.17.0
    command: ["--config", "/config/martin-config.yaml"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    ports:
      - "127.0.0.1:${KADASTRS_MARTIN_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- lint profile: pre-commit hooks in Linux (CLAUDE.md rule 12) ---------------

  # Used by the git hook scripts/git-hooks/pre-commit; manual run:
  #   docker compose --profile lint run --rm lint pre-commit run --all-files
  lint:
    profiles: [lint]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: lint
    image: kadastrs-lint:dev
    working_dir: /src
    volumes:
      - ..:/src
      - precommit_cache:/root/.cache/pre-commit

  # --- etl profile: `docker compose run --rm etl import all` --------------------

  # Imports from data.gov.lv (etl/). Runs the mounted checkout; raw files of the
  # live versions are kept in the etl_raw volume.
  etl:
    profiles: [etl]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: etl
    image: kadastrs-etl:dev
    environment:
      DATABASE_URL: *db-url
      KADASTRS_RAW_DIR: /data/raw
      # Phase 9: pilot (default) or country. Override: KADASTRS_IMPORT_SCOPE=country
      KADASTRS_IMPORT_SCOPE: ${KADASTRS_IMPORT_SCOPE:-}
      # Phase 10: optional webhook URL posted when an import fails (JSON body).
      KADASTRS_ALERT_WEBHOOK: ${KADASTRS_ALERT_WEBHOOK:-}
    volumes:
      - ..:/src:ro
      - etl_raw:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- check profile: `docker compose run --rm check run|show|replay|compare …` ---

  # Check engine CLI (engine/checks/__main__.py). Runs the mounted checkout; the
  # repo is writable so `compare` can write its report next to the input file.
  check:
    profiles: [check]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: check
    image: kadastrs-check:dev
    environment:
      DATABASE_URL: *db-url
    volumes:
      - ..:/src
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- web profile: `docker compose --profile web up web` -------------------------

  # Vite dev server for frontend work (hot reload) at http://127.0.0.1:5173,
  # proxying /api to the api service. Not needed to use the app: the api image
  # serves the built view at http://127.0.0.1:8000/. Node runs only here.
  web:
    profiles: [web]
    image: node:22.11.0-bookworm-slim
    working_dir: /web
    command: ["sh", "-c", "npm ci --ignore-scripts --no-audit --no-fund && npm run dev"]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      api:
        condition: service_healthy

  # --- test profile: `docker compose --profile test run --rm tests` -------------

  # Runs pytest on the api image's Python with the repo mounted at /src.
  # (Tests run in a container so Windows and CI behave the same.)
  tests:
    profiles: [test]
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    image: kadastrs-tests:dev
    environment:
      KADASTRS_TEST_DATABASE_URL: *db-url
      KADASTRS_TEST_API_URL: http://api:8000
      KADASTRS_TEST_NOGRID_DATABASE_URL: postgresql://kadastrs:nogrid@db-nogrid:5432/kadastrs
      # Separate database for fixture imports, so tests never touch dev data.
      KADASTRS_TEST_ETL_DATABASE_URL: postgresql://kadastrs:${KADASTRS_DB_PASSWORD:-kadastrs-dev}@db:5432/kadastrs_test
      KADASTRS_RAW_DIR: /data/raw
    volumes:
      - ..:/src
      - etl_raw:/data/raw:ro
    depends_on:
      api:
        condition: service_healthy
      db-nogrid:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully

  # Creates (if missing) and migrates the kadastrs_test database.
  migrate-test:
    profiles: [test]
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://kadastrs:${KADASTRS_DB_PASSWORD:-kadastrs-dev}@db:5432/kadastrs_test?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./migrations:/migrations:ro
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  # Same DB image with the grid deleted, to prove the CRS tests fail without it.
  # Throwaway: data on tmpfs, no migrations (the test applies what it needs).
  db-nogrid:
    profiles: [test]
    image: kadastrs-db:dev
    entrypoint:
      - sh
      - -c
      - rm -f /usr/share/proj/lv_lgia_lks92to2020.tif && exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: kadastrs
      POSTGRES_USER: kadastrs
      POSTGRES_PASSWORD: nogrid
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kadastrs", "-d", "kadastrs"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      db:
        condition: service_started  # only to make sure kadastrs-db:dev is built first

  # --- e2e profile: the results view in a browser (Playwright) --------------------
  #   docker compose --profile test run --rm tests python -m tests.e2e.seed
  #   docker compose --profile e2e up -d --force-recreate --wait api-e2e
  #   docker compose --profile e2e run --rm e2e

  # The api image on the seeded kadastrs_test database; no network for freshness.
  api-e2e:
    profiles: [e2e]
    image: kadastrs-api:dev
    environment:
      DATABASE_URL: postgresql://kadastrs:${KADASTRS_DB_PASSWORD:-kadastrs-dev}@db:5432/kadastrs_test
      KADASTRS_FRESHNESS_CHECK: "off"
      KADASTRS_RUN_ORIGIN: e2e  # runs hidden from Žurnāls by default
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 3s
    depends_on:
      api:
        condition: service_healthy  # same image, built by the api service

  # The api image on the dev database (real pilot data) for review screenshots
  # (e2e/tests/screens.spec.ts). Its runs get origin "e2e", so they stay out of
  # the visible Žurnāls history.
  api-screens:
    profiles: [screens]
    image: kadastrs-api:dev
    environment:
      DATABASE_URL: *db-url
      KADASTRS_FRESHNESS_CHECK: "off"
      KADASTRS_RUN_ORIGIN: e2e
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 3s
    depends_on:
      api:
        condition: service_healthy

  # Playwright in its official container (no Node on the host); OSM tiles are
  # answered with a blank image inside the test.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    working_dir: /e2e
    environment:
      E2E_BASE_URL: http://api-e2e:8000
    command: ["sh", "-c", "npm ci --ignore-scripts --no-audit --no-fund && npx playwright test"]
    volumes:
      - ../e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      api-e2e:
        condition: service_healthy

volumes:
  dbdata:
  web_node_modules:
  e2e_node_modules:
  etl_raw:
  precommit_cache:
